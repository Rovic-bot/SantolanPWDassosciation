{% if field %}<div class="builder-field{% if wide %} builder-wide{% endif %}" data-field="{{ field.name }}"><label for="{{ field.id_for_label }}">{% if field.name == 'kind' %}Response type{% elif field.name == 'label' %}Requirement name{% else %}{{ field.label }}{% endif %}{% if field.field.required %}<span class="builder-required"> *</span>{% elif '(optional)' not in field.label %}<span class="builder-optional"> Optional</span>{% endif %}</label>{{ field }}{{ field.errors }}{% if field.help_text %}<p class="builder-help">{{ field.help_text }}</p>{% endif %}</div>{% endif %}
