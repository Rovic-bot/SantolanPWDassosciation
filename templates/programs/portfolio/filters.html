<form method="get" action="{% url 'program_portfolio' %}" class="portfolio-filters" data-portfolio-filters role="search" aria-label="Filter programs">
  <div class="portfolio-filter-main">
    <div><label for="program-search">Find a program</label><div class="portfolio-search">{% include 'programs/ui_icon.html' with name='search' %}<input id="program-search" name="q" type="search" value="{{ query }}" maxlength="200" placeholder="Search title or program code" autocomplete="off" class="form-control"></div></div>
    <div><label for="program-type">Category</label><select id="program-type" name="assistance_type" class="form-select"><option value="">All categories</option>{% for value in assistance_types %}<option{% if assistance_type == value %} selected{% endif %}>{{ value }}</option>{% endfor %}</select></div>
    <div><label for="program-status">Status</label><select id="program-status" name="status" class="form-select"><option value="">All statuses</option>{% for value,label in statuses %}<option value="{{ value }}"{% if status == value %} selected{% endif %}>{{ label }}</option>{% endfor %}</select></div>
    <p class="portfolio-count" aria-live="polite" aria-atomic="true"><strong data-portfolio-count>{{ page_obj.paginator.count }}</strong><span data-portfolio-count-label>program{{ page_obj.paginator.count|pluralize }}</span></p>
  </div>
  <div class="portfolio-filter-footer"><details class="portfolio-more-filters"{% if registration or with_applications or sort != 'newest' %} open{% endif %}><summary>More filters</summary><div class="portfolio-extra-fields"><div><label for="program-sort">Sort by</label><select id="program-sort" name="sort" class="form-select">{% for value,label in sort_options %}<option value="{{ value }}"{% if sort == value %} selected{% endif %}>{{ label }}</option>{% endfor %}</select></div><div><label for="program-registration">Registration</label><select id="program-registration" name="registration" class="form-select"><option value="">All registration periods</option>{% for value,label in registration_options %}<option value="{{ value }}"{% if registration == value %} selected{% endif %}>{{ label }}</option>{% endfor %}</select></div><label class="portfolio-check"><input type="checkbox" name="with_applications" value="1"{% if with_applications %} checked{% endif %}> With applications</label></div></details><a href="{% url 'program_portfolio' %}" data-portfolio-reset>Clear filters</a></div>
  <p class="portfolio-feedback" role="status" data-portfolio-feedback></p>
  <button class="btn btn-primary" type="submit" data-portfolio-submit>Apply filters</button>
</form>
