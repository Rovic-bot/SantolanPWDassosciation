<form method="get" action="{% url 'application_workspace' %}" class="chooser-filters chooser-glass" data-review-filters role="search" aria-label="Filter programs for application review">
  <div class="chooser-filter-fields">
    <div><label for="review-search">Search programs</label><input type="search" id="review-search" name="q" maxlength="200" value="{{ query }}" placeholder="Program title or code" autocomplete="off"></div>
    <div><label for="review-type">Assistance type</label><select id="review-type" name="assistance_type"><option value="">All types</option>{% for item in assistance_types %}<option{% if item == assistance_type %} selected{% endif %}>{{ item }}</option>{% endfor %}</select></div>
    <div><label for="review-status">Program status</label><select id="review-status" name="status"><option value="">All statuses</option>{% for code,label in statuses %}<option value="{{ code }}"{% if status == code %} selected{% endif %}>{{ label }}</option>{% endfor %}</select></div>
    <p class="chooser-count" aria-live="polite" aria-atomic="true"><strong data-review-count>{{ page_obj.paginator.count }}</strong><span data-review-count-label>program{{ page_obj.paginator.count|pluralize }}</span></p>
  </div>
  <div class="chooser-filter-footer"><details{% if registration or with_applications or sort != 'newest' %} open{% endif %}><summary>More filters</summary><div class="chooser-extra-filters"><div><label for="review-registration">Registration</label><select id="review-registration" name="registration"><option value="">All periods</option>{% for code,label in registration_options %}<option value="{{ code }}"{% if code == registration %} selected{% endif %}>{{ label }}</option>{% endfor %}</select></div><div><label for="review-sort">Sort</label><select id="review-sort" name="sort">{% for code,label in sort_options %}<option value="{{ code }}"{% if code == sort %} selected{% endif %}>{{ label }}</option>{% endfor %}</select></div><label class="chooser-checkbox"><input type="checkbox" name="with_applications" value="1"{% if with_applications %} checked{% endif %}> With applications</label></div></details><a href="{% url 'application_workspace' %}" data-review-reset>Clear filters</a></div>
  <p class="chooser-feedback" role="status" data-review-feedback></p><button class="btn btn-primary" type="submit" data-review-submit>Search programs</button>
</form>
