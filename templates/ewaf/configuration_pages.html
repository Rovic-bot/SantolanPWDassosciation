{% if page_obj.has_other_pages %}<nav class="pagination-bar" aria-label="{{ pagination_label }}">
{% if page_obj.has_previous %}<a href="?revision={{ current.pk }}&amp;{{ parameter }}={{ page_obj.previous_page_number }}">Previous</a>{% endif %}
<span>Page {{ page_obj.number }} of {{ page_obj.paginator.num_pages }}</span>
{% if page_obj.has_next %}<a href="?revision={{ current.pk }}&amp;{{ parameter }}={{ page_obj.next_page_number }}">Next</a>{% endif %}
</nav>{% endif %}
