<dialog class="record-details-dialog" id="record-details-dialog" aria-labelledby="record-dialog-heading">
  <header class="record-dialog-toolbar"><h2 id="record-dialog-heading">Record details</h2>{% if not hide_record_full_page %}<a href="#" data-record-full-page>Open full page</a>{% endif %}<button type="button" class="record-dialog-close" data-record-dialog-close aria-label="Close record">×</button></header>
  <p class="record-dialog-status" data-record-dialog-status role="status"></p>
  <div class="record-dialog-content" data-record-dialog-content></div>
</dialog>
