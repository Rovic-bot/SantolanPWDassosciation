<div id="toolbar"><form id="changelist-search" method="get" role="search"><div>
  <label for="searchbar"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="10" cy="10" r="6"/><path d="m15 15 6 6"/></svg><span class="visually-hidden">Search {% include 'admin/workspace_title.html' %}</span></label>
  <input type="search" name="q" value="{{ cl.query }}" id="searchbar" placeholder="{% if opts.label_lower == 'auth.user' %}Search administrator accounts…{% elif opts.label_lower == 'auth.group' %}Search roles or permissions…{% elif opts.label_lower == 'audit.securityevent' %}Search by username or IP address…{% else %}Search by object, user, or details…{% endif %}">
  <input type="submit" value="Search">
  {% for key, value in cl.params.items %}{% if key != 'q' and key != 'p' %}<input type="hidden" name="{{ key }}" value="{{ value }}">{% endif %}{% endfor %}
</div></form></div>
