<div class="mb-4{% if field.name == 'address' or field.name == 'disability_information' or field.name == 'employment_information' %} form-field-wide{% endif %}">
  <label class="form-label fw-semibold" for="{{ field.id_for_label }}">{{ field.label }}{% if field.field.required %} <span aria-hidden="true">*</span><span class="visually-hidden"> (required)</span>{% else %} <span class="text-secondary fw-normal">(optional)</span>{% endif %}</label>
  {{ field }}
  {% if field.help_text %}<div class="form-text" id="{{ field.auto_id }}_helptext">{{ field.help_text }}</div>{% endif %}
  {{ field.errors }}
</div>
