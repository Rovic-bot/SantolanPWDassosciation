<div class="pdao-options {{ layout }}" data-pdao-options="{{ field }}">{% for option in choices %}<span class="pdao-option"><span class="pdao-checkbox{% if option.checked %} is-checked{% endif %}" aria-hidden="true">{% if option.checked %}✓{% endif %}</span><span class="pdao-sr-only">{% if option.checked %}Selected: {% else %}Not selected: {% endif %}</span>{{ option.label }}</span>{% endfor %}</div>
