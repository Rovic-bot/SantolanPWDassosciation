<div class="public-swipe-controls" data-swipe-controls hidden>
    <div><p class="public-swipe-count" data-swipe-status role="status" aria-live="polite" aria-atomic="true"></p><p class="public-swipe-hint">Swipe left or right to explore</p></div>
    <div class="public-swipe-arrows">
        <button type="button" data-swipe-previous aria-label="Previous card"><span aria-hidden="true">&larr;</span></button>
        <button type="button" data-swipe-next aria-label="Next card"><span aria-hidden="true">&rarr;</span></button>
    </div>
</div>
