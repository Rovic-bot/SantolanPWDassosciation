<div class="public-stack-controls" data-stack-controls hidden role="group" aria-label="Card navigation">
    <button type="button" class="public-stack-arrow" data-stack-previous aria-label="Previous card" aria-controls="{{ viewport_id }}">{% include 'public/icon.html' with name='arrow' %}</button>
    <div class="public-stack-dots" data-stack-dots></div>
    <button type="button" class="public-stack-arrow" data-stack-next aria-label="Next card" aria-controls="{{ viewport_id }}">{% include 'public/icon.html' with name='arrow' %}</button>
</div>
<p class="visually-hidden" data-stack-status role="status" aria-live="polite" aria-atomic="true"></p>
