<div class="overview-metric" data-state="{{ metric.state }}">
  <span class="overview-metric-index" aria-hidden="true">0{{ forloop.counter }}</span>
  <p class="overview-number">{{ metric.value }}</p>
  <h2 aria-label="{{ metric.label }}">{{ metric.short_label }}</h2>
  <p class="overview-caption">{{ metric.short_caption }}</p>
</div>
